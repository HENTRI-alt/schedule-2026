            const TIMINGS = [{"s":"08:30","e":"09:50"},{"s":"10:00","e":"11:20"},{"s":"11:40","e":"13:00"},{"s":"13:10","e":"14:30"},{"s":"14:40","e":"16:00"},{"s":"16:10","e":"17:30"}];
            const P = document.getElementById('p');
            
            function fmt(dObj) {
                return dObj.getFullYear() + '-' + String(dObj.getMonth()+1).padStart(2,'0') + '-' + String(dObj.getDate()).padStart(2,'0');
            }
            
            window.cp = function(txt, el) {
                navigator.clipboard.writeText(txt).then(() => {
                    const orig = el.innerHTML;
                    el.innerHTML = 'Скопійовано ✓';
                    el.style.color = '#3fb950';
                    el.style.borderColor = '#3fb950';
                    setTimeout(() => { el.innerHTML = orig; el.style.color = ''; el.style.borderColor = ''; }, 1500);
                });
            };

            if(P) {
                P.value = fmt(new Date());
                P.addEventListener('change', R);
            }
            
            setInterval(checkLive, 1000);
            
            function setDate(offset) {
                const d = new Date();
                d.setDate(d.getDate() + offset);
                if(P) {
                    P.value = fmt(d);
                    R();
                }
            }

            function R() {
                if(!P) return;
                const d = P.value;
                const l1 = document.getElementById('l1');
                const l2El = document.getElementById('l2');
                if(l1) l1.innerHTML = '';
                if(l2El) l2El.innerHTML = '';
                
                const today = new Date();
                const todayStr = fmt(today);
                const tom = new Date(); tom.setDate(tom.getDate()+1);
                const tomStr = fmt(tom);
                
                const qbToday = document.getElementById('qb-today');
                const qbTom = document.getElementById('qb-tom');
                if(qbToday) qbToday.className = 'qb' + (d === todayStr ? ' active' : '');
                if(qbTom) qbTom.className = 'qb' + (d === tomStr ? ' active' : '');
                
                if(!d) {
                    if(l1) l1.innerHTML = '<div class="nodata">Оберіть дату для відображення розкладу</div>';
                    if(l2El) l2El.innerHTML = '<div class="nodata">Оберіть дату для відображення розкладу</div>';
                    return;
                }
                
                const parts = d.split('-');
                const o = new Date(parts[0], parts[1]-1, parts[2]);
                
                const ds = ["Неділя", "Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота"];
                const ms = ["січня", "лютого", "березня", "квітня", "травня", "червня", "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];
                
                const dtEl = document.getElementById('dt');
                if(dtEl) dtEl.innerHTML = ds[o.getDay()] + ' <span class="d-h">' + o.getDate() + ' ' + ms[o.getMonth()] + '</span>';
                
                if(!DB[d]) {
                    if(l1) l1.innerHTML = '<div class="nodata">Заняття відсутні (Вихідний)</div>';
                    if(l2El) l2El.innerHTML = '<div class="nodata">Заняття відсутні (Вихідний)</div>';
                    return;
                }
                
                RC(l1, DB[d][1], 1, d);
                if(l2El) RC(l2El, DB[d][2], 2, d);
                
                checkLive();
            }
            
            function RC(c, dData, g, dateKey) {
                for(let i=1; i<=6; i++) {
                    const l = (dData && dData[i]) ? dData[i] : null;
                    const t = (TIMINGS && TIMINGS[i-1]) ? TIMINGS[i-1] : {s:'', e:''};
                    const timeHTML = (t.s || t.e) ? '<div class="n-time">' + t.s + '<br>' + t.e + '</div>' : '';
                    
                    const div = document.createElement('div');
                    div.dataset.ts = t.s;
                    div.dataset.te = t.e;
                    
                    if(!l) {
                        div.className = 'card emp slot-card';
                        div.innerHTML = '<div class="head"><div class="n-col"><div class="n">' + i + '</div>' + timeHTML + '</div><div class="win">Вільний час (Вікно)</div></div>';
                    } else {
                        div.className = 'card slot-card f' + g;
                        let acts = '<div class="card-actions">';
                        
                        if(l.link) {
                            acts += '<a href="' + l.link + '" target="_blank" class="btn">Приєднатися (Онлайн)</a>';
                        }
                        
                        if(l.classLink) {
                            acts += '<a href="' + l.classLink + '" target="_blank" class="btn" style="background:#9d7cff; border-color:#9d7cff;">Классрум</a>';
                        }
                        
                        if(l.zid || l.zcode) {
                            acts += '<div style="display:flex; gap:10px; flex-wrap:wrap;">';
                            if(l.zid) acts += '<div class="copy-b" onclick="cp(\'' + l.zid + '\', this)" title="Копіювати ID">ID: ' + l.zid + ' 📋</div>';
                            if(l.zcode) acts += '<div class="copy-b" onclick="cp(\'' + l.zcode + '\', this)" title="Копіювати код">Код: ' + l.zcode + ' 📋</div>';
                            acts += '</div>';
                        }
                        
                        acts += '</div>';
                        
                        div.innerHTML = '<div class="live-badge">Поточне заняття <span style="opacity:0.5; margin:0 4px">•</span> <span class="c-timer" style="font-weight:600; font-size:0.8rem;">...</span></div><div class="head"><div class="n-col"><div class="n">' + i + '</div>' + timeHTML + '</div><div style="flex:1"><div class="tit">' + l.sub + '</div><div class="meta"><div class="meta-row"><span>' + l.name + '</span><span>' + (l.room ? l.room : '') + '</span></div></div></div></div>' + acts;
                    }
                    c.appendChild(div);
                }
            }
            
            function checkLive() {
                const banner = document.getElementById('breakBanner');
                const timerEl = document.getElementById('breakTimer');

                if(!P) return;
                const d = P.value;
                const todayStr = fmt(new Date());
                
                if (d !== todayStr || !DB[d]) {
                    banner.classList.remove('show');
                    return;
                }
                
                const now = new Date();
                const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
                let isClassLive = false;
                
                document.querySelectorAll('.slot-card').forEach(card => {
                    card.classList.remove('live');
                    const ts = card.dataset.ts;
                    const te = card.dataset.te;
                    
                    if(ts && te) {
                        const [sh, sm] = ts.split(':').map(Number);
                        const [eh, em] = te.split(':').map(Number);
                        const startSec = sh * 3600 + sm * 60;
                        const endSec = eh * 3600 + em * 60;
                        
                        if (currentSeconds >= startSec && currentSeconds < endSec) {
                            card.classList.add('live');
                            isClassLive = true;
                            
                            const tSpan = card.querySelector('.c-timer');
                            if (tSpan) {
                                const diff = endSec - currentSeconds;
                                const h = Math.floor(diff / 3600);
                                const m = Math.floor((diff % 3600) / 60);
                                
                                let timeStr = '';
                                if (h > 0) timeStr += h + ' год ';
                                timeStr += m + ' хв';
                                
                                if (diff < 60) timeStr = '< 1 хв';
                                
                                tSpan.innerText = timeStr;
                            }
                        }
                    }
                });

                if (!isClassLive) {
                    let upcomingStart = null;
                    
                    for (let i = 0; i < TIMINGS.length; i++) {
                        const t = TIMINGS[i];
                        if (!t.s) continue;
                        const [sh, sm] = t.s.split(':').map(Number);
                        const startSec = sh * 3600 + sm * 60;
                        if (startSec > currentSeconds) {
                            upcomingStart = startSec;
                            break;
                        }
                    }

                    if (upcomingStart) {
                        const diff = upcomingStart - currentSeconds;
                        if (diff <= 1800) { 
                            const m = Math.floor(diff / 60).toString().padStart(2, '0');
                            const s = (diff % 60).toString().padStart(2, '0');
                            timerEl.innerText = m + ':' + s;
                            
                            if (diff <= 60) timerEl.classList.add('urgent');
                            else timerEl.classList.remove('urgent');

                            banner.classList.add('show');
                        } else {
                            banner.classList.remove('show');
                        }
                    } else {
                        banner.classList.remove('show');
                    }
                } else {
                    banner.classList.remove('show');
                }
            }
            
            R();
