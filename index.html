<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<title>Розклад: ПЗ - 11</title>
<style>
:root{
  color-scheme:dark light;
  --bg:#0e0e10; --row:#1b1b1e; --sep:#2d2d31;
  --text:#f2f2f4; --muted:#9a9aa1; --dim:#76767d;
  --accent:#0a84ff; --accent-bg:rgba(10,132,255,.15);
  --green:#238636; --exam:#ff9f0a; --ok:#30d158;
  --seg-bg:rgba(118,118,128,.24); --seg-on:#636366;
  --bar-l:60%;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#f2f2f7; --row:#ffffff; --sep:#dcdce1;
    --text:#111114; --muted:#6c6c72; --dim:#8e8e95;
    --accent:#007aff; --accent-bg:rgba(0,122,255,.1);
    --green:#1f7a33; --exam:#c26a00; --ok:#1f9d46;
    --seg-bg:rgba(118,118,128,.12); --seg-on:#ffffff;
    --bar-l:48%;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:640px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
.app[data-mode="both"]{max-width:980px}

/* ---------- верх ---------- */
.top h1{margin:0;font-size:34px;line-height:1.1;font-weight:700}
.top p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.seg{
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:16px;padding:2px;border-radius:9px;background:var(--seg-bg);
}
.seg button{
  border:0;background:transparent;padding:7px 10px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;
}
.seg button[aria-checked="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.seg .wide{display:none}
@media (min-width:900px){.seg .wide{display:block}}

/* ---------- тиждень ---------- */
.weekbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;margin:22px 0 6px}
.wb-left,.wb-right{display:flex;align-items:center}
.wb-left{gap:2px}
.wb-left b{font-size:15px;font-weight:600;margin-right:6px}
.wb-right{gap:16px}
.arrow{width:30px;height:30px;display:grid;place-items:center;padding:0;border:0;border-radius:8px;background:none;color:var(--accent);cursor:pointer}
.arrow:hover{background:var(--accent-bg)}
.arrow svg{width:16px;height:16px}
.link{position:relative;display:inline-flex;align-items:center;padding:4px 0;border:0;background:none;font-size:14px;color:var(--accent);cursor:pointer}
.link:hover{opacity:.75}
.link svg{width:20px;height:20px}
.link input{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}

.strip{display:grid;grid-template-columns:repeat(7,1fr);padding:2px 0 12px;border-bottom:1px solid var(--sep)}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border:0;background:none;cursor:pointer}
.day .wd{font-size:11.5px;font-weight:500;color:var(--muted)}
.day .n{
  width:36px;height:36px;display:grid;place-items:center;border-radius:50%;
  font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--text);
}
.day:not(.has) .n{color:var(--dim)}
.day.today .n{color:var(--accent);font-weight:700}
.day.sel .n{background:var(--accent);color:#fff;font-weight:700}
.day.sel .wd{color:var(--text)}
.day:not(.sel):hover .n{background:var(--accent-bg)}

/* ---------- день ---------- */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 2px 12px}
.dayhead h2{margin:0;font-size:22px;line-height:1.2;font-weight:700}
.dayhead p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.dayhead .rel{font-size:14px;font-weight:600;color:var(--accent);white-space:nowrap}

.list{min-height:44vh}
.list.fade{animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}}

.colhead{display:grid;grid-template-columns:64px 1fr 1fr;gap:16px;padding:0 14px 6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.group{overflow:hidden;border-radius:12px;background:var(--row)}
.row{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;padding:12px 14px}
.row+.row{border-top:1px solid var(--sep)}
.app[data-mode="both"] .row{grid-template-columns:64px 1fr 1fr}
.row[data-live="now"]{background:var(--accent-bg)}
.prog{position:absolute;left:0;bottom:0;height:2px;background:var(--accent)}

.t{font-variant-numeric:tabular-nums;line-height:1.25}
.t small{display:block;margin-bottom:3px;font-size:11px;color:var(--dim)}
.t b{display:block;font-size:16px;font-weight:600}
.t span{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.row.free{padding-top:10px;padding-bottom:10px;align-items:center}
.row.free .t b{font-size:14px;font-weight:500;color:var(--dim)}
.free-text{color:var(--dim);font-size:14px}
.row.free .free-text{grid-column:2/-1}

.cell{min-width:0;padding-left:11px;border-left:3px solid hsl(var(--h) 55% var(--bar-l))}
.live{margin-bottom:3px;font-size:12.5px;font-weight:600;color:var(--accent)}
.live.soon{color:var(--muted)}
.subj{font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.sub{margin-top:2px;font-size:13.5px;color:var(--muted)}
.exam{font-weight:600;color:var(--exam)}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;margin-top:10px}
.join{
  display:inline-block;padding:8px 14px;border-radius:8px;background:var(--green);color:#fff;
  font-size:14px;font-weight:600;text-decoration:none;
}
.join:hover{filter:brightness(1.12)}
.join.cls{background:var(--accent-bg);color:var(--accent)}
.join.cls:hover{filter:none;opacity:.8}
.join:active{filter:brightness(.95)}
.cp{
  display:inline-flex;align-items:center;gap:6px;padding:6px 0;border:0;background:none;cursor:pointer;
  font:12.5px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);
}
.cp:hover{color:var(--text)}
.cp svg{width:13px;height:13px;color:var(--accent)}
.cp.ok svg{color:var(--ok)}

.empty{padding:70px 20px;text-align:center;font-size:17px;font-weight:600;color:var(--muted)}
.empty span{display:block;margin-top:4px;font-size:13.5px;font-weight:400;color:var(--dim)}

@media (max-width:480px){
  .top h1{font-size:30px}
  .row{gap:12px;padding:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ===================================================================== */
const WEEKDAYS = ["Неділя","Понеділок","Вівторок","Середа","Четвер","П’ятниця","Субота"];
const SHORT = ["Нд","Пн","Вт","Ср","Чт","Пт","Сб"];
const MONTHS = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const MONTHS_NOM = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
const SEM_START = "2026-09-01", SEM_END = "2026-12-27";

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (iso, n) => { const d = fromISO(iso); return toISO(new Date(d.getFullYear(), d.getMonth(), d.getDate()+n)); };
const mins = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, f) => { const a = n%10, b = n%100; return `${n} ${a===1 && b!==11 ? f[0] : (a>=2 && a<=4 && (b<10 || b>=20) ? f[1] : f[2])}`; };
const dur = m => { const h = Math.floor(m/60), r = m%60; return h ? `${h} год${r ? " "+r+" хв" : ""}` : `${r} хв`; };

const ICON_COPY = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25Z"/><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25Zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25Z"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z"/></svg>';

/* ---------- стан ---------- */
const wideMQ = window.matchMedia("(min-width: 900px)");
let pref = "1";
try { const s = localStorage.getItem("pz11-subgroup"); if (s === "1" || s === "2" || s === "both") pref = s; } catch (e) {}
const mode = () => (pref === "both" && !wideMQ.matches) ? "1" : pref;
let cur = toISO(new Date());
let lastList = "";

/* ---------- «зараз / далі» ---------- */
function liveInfo(iso, anyLesson) {
  const now = new Date();
  if (iso !== toISO(now)) return {};
  const nm = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  for (let p = 1; p <= PAIRS.length; p++) {
    const a = mins(PAIRS[p-1][0]), b = mins(PAIRS[p-1][1]);
    if (anyLesson[p-1] && nm >= a && nm < b) return { [p]: { state:"now", left:Math.ceil(b-nm), pct:(nm-a)/(b-a) } };
  }
  for (let p = 1; p <= PAIRS.length; p++) {
    const a = mins(PAIRS[p-1][0]);
    if (anyLesson[p-1] && a > nm) return { [p]: { state:"next", wait:Math.ceil(a-nm) } };
  }
  return {};
}

/* ---------- розмітка ---------- */
const cp = (label, value) => value
  ? `<button class="cp" type="button" data-copy="${esc(value)}" title="Скопіювати" aria-label="Скопіювати ${label}"><span>${label} ${esc(value)}</span><i>${ICON_COPY}</i></button>`
  : "";

function cellHTML(lesson, live) {
  const [subj, type, room, tKey] = lesson;
  const S = SUBJECTS[subj] || { name: subj, hue: 260 };
  const T = TEACHERS[tKey] || { name: tKey, url: "" };
  const kind = type === "ЗАЛІК" ? `<span class="exam">Залік</span>` : esc(TYPES[type] || type);
  let h = `<div class="cell" style="--h:${S.hue}">`;
  if (live) h += live.state === "now" ? `<div class="live">Зараз · ще ${dur(live.left)}</div>` : `<div class="live soon">Далі · через ${dur(live.wait)}</div>`;
  h += `<div class="subj">${esc(S.name)}</div>`;
  h += `<div class="sub">${esc(T.name || tKey)}</div>`;
  h += `<div class="sub">${kind} · ауд. ${esc(room)}</div>`;
  const CU = classroomUrl(subj, type, tKey);
  if (T.url || CU) {
    h += `<div class="act">` +
      (T.url ? `<a class="join" href="${esc(T.url)}" target="_blank" rel="noopener noreferrer">Приєднатися (Онлайн)</a>` : "") +
      (CU ? `<a class="join cls" href="${esc(CU)}" target="_blank" rel="noopener noreferrer">Класрум</a>` : "") +
      (T.url ? `${cp("ID", T.id)}${cp("Код", T.code)}` : "") + `</div>`;
  }
  return h + `</div>`;
}

function renderStrip() {
  const d = fromISO(cur), dow = (d.getDay()+6)%7, today = toISO(new Date());
  $("monthLabel").textContent = `${MONTHS_NOM[d.getMonth()]} ${d.getFullYear()}`;
  let h = "";
  for (let i = 0; i < 7; i++) {
    const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate()-dow+i), k = toISO(dd);
    h += `<button class="day${k===cur?" sel":""}${k===today?" today":""}${SCHEDULE[k]?" has":""}" type="button" data-iso="${k}" aria-pressed="${k===cur}" aria-label="${WEEKDAYS[dd.getDay()]}, ${dd.getDate()} ${MONTHS[dd.getMonth()]}"><span class="wd">${SHORT[dd.getDay()]}</span><span class="n">${dd.getDate()}</span></button>`;
  }
  $("strip").innerHTML = h;
}

function renderList() {
  const m = mode(), sgs = m === "both" ? ["1","2"] : [m], both = sgs.length === 2;
  const day = SCHEDULE[cur] || null;
  $("app").dataset.mode = m;

  const rows = [];
  if (day) {
    for (let p = 1; p <= PAIRS.length; p++) {
      const entry = day[p] || {};
      rows.push(sgs.map(sg => entry[sg] || entry.all || null));
    }
  }
  const any = rows.map(r => r.some(Boolean));
  const live = day ? liveInfo(cur, any) : {};

  /* заголовок дня */
  const dt = fromISO(cur), now = new Date();
  const tomorrow = toISO(new Date(now.getFullYear(), now.getMonth(), now.getDate()+1));
  const rel = cur === toISO(now) ? "Сьогодні" : (cur === tomorrow ? "Завтра" : "");
  let sum = "";
  if (any.some(Boolean)) {
    const idx = any.map((v,i) => v ? i : -1).filter(i => i >= 0);
    sum = `${plural(idx.length, ["пара","пари","пар"])} · ${PAIRS[idx[0]][0]}–${PAIRS[idx[idx.length-1]][1]}`;
  }
  $("dayHead").innerHTML = `<div><h2>${WEEKDAYS[dt.getDay()]}, ${dt.getDate()} ${MONTHS[dt.getMonth()]}</h2>${sum ? `<p>${sum}</p>` : ""}</div>${rel ? `<span class="rel">${rel}</span>` : ""}`;

  /* список пар */
  let html = "";
  if (!day) {
    const weekend = dt.getDay() === 0 || dt.getDay() === 6;
    const note = weekend ? "Вихідний" : (cur < SEM_START || cur > SEM_END ? "Поза розкладом семестру" : "");
    html = `<div class="empty">Занять немає${note ? `<span>${note}</span>` : ""}</div>`;
  } else {
    if (both) html += `<div class="colhead"><span></span><span>Підгрупа 1</span><span>Підгрупа 2</span></div>`;
    html += `<div class="group">`;
    rows.forEach((cells, i) => {
      const p = i+1, [from, to] = PAIRS[p-1], lv = live[p];
      if (!any[i]) {
        html += `<div class="row free"><div class="t"><b>${from}</b></div><span class="free-text">Вільний час (Вікно)</span></div>`;
        return;
      }
      const inner = cells.map(l => l ? cellHTML(l, lv) : `<span class="free-text">Вільний час (Вікно)</span>`).join("");
      html += `<div class="row"${lv ? ` data-live="${lv.state}"` : ""}><div class="t"><small>${p} пара</small><b>${from}</b><span>${to}</span></div>${inner}` +
        (lv && lv.state === "now" ? `<i class="prog" style="width:${Math.round(lv.pct*100)}%"></i>` : "") + `</div>`;
    });
    html += `</div>`;
  }
  if (html !== lastList) { $("list").innerHTML = html; lastList = html; }
}

function renderSeg() {
  const m = mode();
  document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.sg === m)));
}

function render() { renderStrip(); renderList(); renderSeg(); $("datePick").value = cur; }

function go(iso) {
  const changed = iso !== cur;
  cur = iso; render();
  if (changed) { const l = $("list"); l.classList.remove("fade"); void l.offsetWidth; l.classList.add("fade"); }
}

/* ---------- події ---------- */
$("strip").addEventListener("click", e => { const b = e.target.closest(".day"); if (b) go(b.dataset.iso); });
document.querySelectorAll("[data-week]").forEach(b => b.addEventListener("click", () => go(addDays(cur, 7*Number(b.dataset.week)))));
$("seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  pref = b.dataset.sg;
  try { localStorage.setItem("pz11-subgroup", pref); } catch (err) {}
  lastList = ""; render();
});
$("btnToday").addEventListener("click", () => go(toISO(new Date())));
$("btnTomorrow").addEventListener("click", () => { const n = new Date(); go(toISO(new Date(n.getFullYear(), n.getMonth(), n.getDate()+1))); });
$("btnDate").addEventListener("click", () => {
  const i = $("datePick");
  try { i.showPicker(); } catch (err) { i.focus(); i.click(); }
});
$("datePick").addEventListener("change", e => { if (e.target.value) go(e.target.value); });
wideMQ.addEventListener("change", () => { lastList = ""; render(); });

document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,select") || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowLeft") go(addDays(cur, -1));
  if (e.key === "ArrowRight") go(addDays(cur, 1));
});

let sx = 0, sy = 0, st = 0;
$("list").addEventListener("touchstart", e => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, { passive:true });
$("list").addEventListener("touchend", e => {
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)*1.6 && Date.now() - st < 600) go(addDays(cur, dx < 0 ? 1 : -1));
}, { passive:true });

document.addEventListener("click", async e => {
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;
  const text = btn.dataset.copy, ic = btn.querySelector("i");
  try { await navigator.clipboard.writeText(text); }
  catch (err) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    ta.remove();
  }
  btn.classList.add("ok"); ic.innerHTML = ICON_CHECK;
  setTimeout(() => { btn.classList.remove("ok"); ic.innerHTML = ICON_COPY; }, 1200);
});

/* оновлення «Зараз / Далі» раз на 30 с */
setInterval(() => { if (!document.hidden) render(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

render();
</script>
